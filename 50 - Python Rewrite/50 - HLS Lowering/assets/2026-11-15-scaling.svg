<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Compute cycles as the array grows</title>
<desc id="d">At 32, 256 and 1,024 elements: today's compiler output takes 294, 1,198 and 3,910 cycles; the prototype with the completion check folded into the write-back 260, 692 and 1,858; the prototype with checks proved and staged copies 87, 147 and 289; the prototype's fused loop 75, 108 and 155; the staff's handwritten HLS 77, 109 and 158.</desc>
