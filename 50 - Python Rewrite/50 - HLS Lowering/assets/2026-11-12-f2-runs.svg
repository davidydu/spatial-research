<text x="24.0" y="34.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Compute cycles on the FPGA, six runs each</text>
<text x="24.0" y="54.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Lab 1 tiled scale, 32 elements. Each dot is one run after a fresh image load; the bar is the median.</text>
<line x1="170.0" x2="170.0" y1="72" y2="232" stroke="#c3c2b7" stroke-width="1"/>
<text x="170.0" y="248" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0</text>
<line x1="307.5" x2="307.5" y1="72" y2="232" stroke="#e1e0d9" stroke-width="1"/>
<text x="307.5" y="248" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100</text>
<line x1="445.0" x2="445.0" y1="72" y2="232" stroke="#e1e0d9" stroke-width="1"/>
<text x="445.0" y="248" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">200</text>
<line x1="582.5" x2="582.5" y1="72" y2="232" stroke="#e1e0d9" stroke-width="1"/>
<text x="582.5" y="248" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">300</text>
<line x1="720.0" x2="720.0" y1="72" y2="232" stroke="#e1e0d9" stroke-width="1"/>
<text x="720.0" y="248" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">400</text>
<text x="720.0" y="266.0" font-size="11" fill="#898781" font-weight="400" text-anchor="end">Compute cycles (lower is faster)</text>
