<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Compute cycles on the FPGA, six runs each</title>
<desc id="d">Handwritten HLS took 58 to 62 cycles (median 58). Python Spatial took 256 to 354 (median 260): four runs at 256 to 260 and the first two at 349 and 354.</desc>
