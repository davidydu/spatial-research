<text x="516.0" y="188.5" font-size="12" fill="#0b0b0b" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round">about 155</text>
<text x="24.0" y="220.5" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">+ no flag transfers</text>
<path d="M270.0,208.0 H396.5 A4,4 0 0 1 400.5,212.0 V220.0 A4,4 0 0 1 396.5,224.0 H270.0 Z" fill="#86b6ef"><title>+ no flag transfers: about 85 cycles</title></path>
<text x="408.5" y="220.5" font-size="12" fill="#0b0b0b" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round">about 85</text>
<text x="24.0" y="252.5" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">+ read and write inside the tile loop</text>
<path d="M270.0,240.0 H365.8 A4,4 0 0 1 369.8,244.0 V252.0 A4,4 0 0 1 365.8,256.0 H270.0 Z" fill="#86b6ef"><title>+ read and write inside the tile loop: about 60 to 70 cycles</title></path>
<text x="377.8" y="252.5" font-size="12" fill="#0b0b0b" font-weight="400" text-anchor="start" paint-order="stroke" stroke="#fcfcfb" stroke-width="4" stroke-linejoin="round">about 60 to 70</text>
<line x1="359.1" x2="359.1" y1="100" y2="262" stroke="#fcfcfb" stroke-width="5"/>
<line x1="359.1" x2="359.1" y1="100" y2="262" stroke="#eb6834" stroke-width="2"><title>Handwritten HLS: 58 cycles (measured)</title></line>
