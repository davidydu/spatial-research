<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Where today's design spends its time at 1,024 elements</title>
<desc id="d">Of 3,625 estimated cycles, the final check that every output cell was written takes 2,051, the loop over the 64 tiles 1,110, the six staged copies about 400, and the rest 64.</desc>
<rect x="0.5" y="0.5" width="759" height="213" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Where today's design spends its time at 1,024 elements</text>
<text x="24.0" y="54.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Synthesis estimate for today's compiler output; the kit simulation measured 3,910 cycles.</text>
<rect x="24.0" y="96" width="401.8" height="30" rx="3" fill="#2a78d6"><title>Final check that every output was written: about 2,051 cycles</title></rect>
<text x="26.0" y="146.0" font-size="12" text-anchor="start" style="font-variant-numeric: tabular-nums"><tspan fill="#0b0b0b" font-weight="600">2,051</tspan></text>
<text x="26.0" y="163.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">Final check that every output was written</text>
<rect x="427.8" y="96" width="216.0" height="30" rx="3" fill="#86b6ef"><title>Loop over the 64 tiles: about 1,110 cycles</title></rect>
<text x="429.8" y="146.0" font-size="12" text-anchor="start" style="font-variant-numeric: tabular-nums"><tspan fill="#0b0b0b" font-weight="600">1,110</tspan></text>
<text x="429.8" y="163.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">Loop over the 64 tiles</text>
<rect x="645.9" y="96" width="76.6" height="30" rx="3" fill="#c3c2b7"><title>Six staged copies: about 400 cycles</title></rect>
<text x="647.9" y="146.0" font-size="12" text-anchor="start" style="font-variant-numeric: tabular-nums"><tspan fill="#0b0b0b" font-weight="600">about 400</tspan></text>
<text x="647.9" y="163.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">Six staged copies</text>
<rect x="724.4" y="96" width="10.6" height="30" rx="3" fill="#e1e0d9"><title>Other: about 64 cycles</title></rect>
<text x="736.0" y="86.0" font-size="11" fill="#898781" font-weight="400" text-anchor="end">Estimated cycles, 3,625 in all</text>
<text x="24.0" y="194.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">The check visits one element every two cycles: 1,024 elements, 2,051 cycles. At 32 elements it was 34 of 129.</text>
</svg>
