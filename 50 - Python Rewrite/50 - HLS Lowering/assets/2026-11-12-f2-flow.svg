<text x="471.0" y="215.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">registration</text>
<path d="M471,234 l3.2,3.4 l6,-7.4" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="485.0" y="238.0" font-size="11" fill="#0b0b0b" font-weight="500" text-anchor="start">loadable</text>
<line x1="447" y1="215" x2="458" y2="215" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)"/>
<rect x="604" y="180" width="132" height="70" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
<text x="616.0" y="199.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Run on the chip</text>
<text x="616.0" y="215.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">six fresh loads</text>
<path d="M616,234 l3.2,3.4 l6,-7.4" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="630.0" y="238.0" font-size="11" fill="#0b0b0b" font-weight="500" text-anchor="start">passed 6 of 6</text>
<line x1="592" y1="215" x2="603" y2="215" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)"/>
</svg>
