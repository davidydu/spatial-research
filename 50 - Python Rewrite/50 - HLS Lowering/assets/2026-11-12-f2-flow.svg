<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">From Python Spatial source to a run on the FPGA</title>
<desc id="d">Python Spatial source goes through the compiler and checker to generated C++, then through the class's make flow: gen_rtl passed, hw_sim passed, fpga_build met timing, the AWS image became loadable, and the run on the chip passed six times out of six.</desc>
<rect x="0.5" y="0.5" width="759" height="269" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">From Python Spatial source to a run on the FPGA</text>
<text x="24.0" y="54.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Every step passed for Lab 1 tiled scale, with the generated C++ unchanged throughout.</text>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L7,4 L0,7.2 Z" fill="#898781"/></marker></defs>
<text x="24.0" y="86.0" font-size="11" fill="#52514e" font-weight="600" text-anchor="start">Compiler, on any machine</text>
<rect x="24" y="96" width="150" height="42" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="99.0" y="121.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Python Spatial source</text>
<rect x="198" y="96" width="150" height="42" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="273.0" y="121.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Compiler and checker</text>
<line x1="176" y1="117" x2="196" y2="117" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)"/>
<rect x="372" y="96" width="150" height="42" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="447.0" y="121.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Generated C++</text>
<line x1="350" y1="117" x2="370" y2="117" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)"/>
<path d="M447,140 V160 H90 V178" fill="none" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)"/>
<text x="736.0" y="170.0" font-size="11" fill="#52514e" font-weight="600" text-anchor="end">The class's make flow, on the F2 instance</text>
<rect x="24" y="180" width="132" height="70" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
<text x="36.0" y="199.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">gen_rtl</text>
<text x="36.0" y="215.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">C++ to Verilog</text>
<path d="M36,234 l3.2,3.4 l6,-7.4" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="50.0" y="238.0" font-size="11" fill="#0b0b0b" font-weight="500" text-anchor="start">passed</text>
<rect x="169" y="180" width="132" height="70" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
<text x="181.0" y="199.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">hw_sim</text>
<text x="181.0" y="215.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">shell simulation</text>
<path d="M181,234 l3.2,3.4 l6,-7.4" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="195.0" y="238.0" font-size="11" fill="#0b0b0b" font-weight="500" text-anchor="start">passed</text>
<line x1="157" y1="215" x2="168" y2="215" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)"/>
<rect x="314" y="180" width="132" height="70" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
<text x="326.0" y="199.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">fpga_build</text>
<text x="326.0" y="215.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">place and route</text>
<path d="M326,234 l3.2,3.4 l6,-7.4" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="340.0" y="238.0" font-size="11" fill="#0b0b0b" font-weight="500" text-anchor="start">timing met</text>
<line x1="302" y1="215" x2="313" y2="215" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)"/>
<rect x="459" y="180" width="132" height="70" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
