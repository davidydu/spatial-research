<title id="t">The plan to April 2027</title>
<desc id="d">Lab features in order: Lab 1 DRAM and SRAM (runs on the FPGA), FIFO (design reviewed), Reg, Reduce and Fold, then Lab 2 and Lab 3 features. Hardware in parallel: single-exit loops, then an interface redesign with less memory traffic and a generated wrapper and host program. Target: April 2027.</desc>
