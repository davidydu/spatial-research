<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The four pieces of a design on the F2 instance</title>
<desc id="d">Host program on the instance CPU talks to the AWS shell on the FPGA; the wrapper sits between the shell and the kernel and connects the kernel to off-chip memory. Only the kernel is generated today; the wrapper and host program are to be generated.</desc>
<rect x="0.5" y="0.5" width="759" height="295" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="34.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">The four pieces of a design on the F2 instance</text>
<text x="24.0" y="54.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">In this experiment the host program was written by hand and the wrapper was the course file with three edits.</text>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L7,4 L0,7.2 Z" fill="#898781"/></marker></defs>
<rect x="24" y="74" width="16" height="11" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="47.0" y="84.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">Generated by the compiler today</text>
<rect x="236" y="74" width="16" height="11" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.75"/><text x="259.0" y="84.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">To be generated (decided 12 November)</text>
<rect x="490" y="74" width="16" height="11" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/><text x="513.0" y="84.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">Fixed, not ours</text>
<rect x="24" y="104" width="176" height="98" rx="8" fill="#f1f0eb"/><text x="36.0" y="123.0" font-size="11" fill="#52514e" font-weight="600" text-anchor="start">Instance CPU</text>
<rect x="236" y="104" width="500" height="98" rx="8" fill="#f1f0eb"/><text x="248.0" y="123.0" font-size="11" fill="#52514e" font-weight="600" text-anchor="start">FPGA</text>
<rect x="40" y="134" width="144" height="54" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.75"/>
<text x="112.0" y="157.8" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Host program</text>
<text x="112.0" y="172.2" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">sets up, starts, checks</text>
<rect x="252" y="134" width="120" height="54" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="312.0" y="157.8" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Shell</text>
<text x="312.0" y="172.2" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">AWS's fixed logic</text>
<rect x="404" y="134" width="150" height="54" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.75"/>
<text x="479.0" y="157.8" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Wrapper</text>
<text x="479.0" y="172.2" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">design_top.sv</text>
<rect x="586" y="134" width="134" height="54" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="653.0" y="157.8" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Kernel</text>
<text x="653.0" y="172.2" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">the computation</text>
<rect x="404" y="232" width="150" height="42" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="479.0" y="257.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="middle">Off-chip memory</text>
<line x1="186" y1="161" x2="250" y2="161" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)" marker-start="url(#ah)"/>
<line x1="374" y1="161" x2="402" y2="161" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)" marker-start="url(#ah)"/>
<line x1="556" y1="161" x2="584" y2="161" stroke="#898781" stroke-width="1.25" marker-end="url(#ah)" marker-start="url(#ah)"/>
